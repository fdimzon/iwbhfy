<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anniversary Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fdf2f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #333; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; border: 2px solid #ffb6c1; }
        h1 { color: #d63384; margin-bottom: 0.5rem; }
        .big-number { font-size: 3rem; font-weight: bold; color: #d63384; display: block; }
        .subtext { color: #666; margin-bottom: 1.5rem; }
        .countdown { background: #fff0f3; padding: 1rem; border-radius: 10px; color: #c2185b; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Happy Anniversary!</h1>
        <p class="subtext">Married since {{ wedding_date }}</p>
        
        <span class="big-number">{{ years }} Years</span>
        <p>of love, patience, and shared memories.</p>

        <div class="countdown">
    {% if today_is_anniversary %}
        Today is your 23rd Anniversary! Cheers to 2003! 🥂
    {% else %}
        Only {{ days_until }} days until your next anniversary.
    {% endif %}
</div>
    </div>
</body>
</html>
